# Konfigurasi Proyek PLI
settings:
  input_file: "2025-Peraturan-Badan-Pusat-Statistik-No_7_Klasifikasi_Baku_Lapangan_Usaha_Indonesia_2025.pdf"
  
  # Opsi: "all", "1,2,5", atau "1-10"
  page_range: "1-49" 

  # Parameter deteksi layout
  thresholds:
    center_limit: 0.01
    left_ratio_min: 0.45
    left_ratio_max: 0.55

# Tambahkan bagian ini
refinement_rules:
  - label: "KONSIDERAN"
    prefix: "^Menimbang\\s*:\\s*"
    numbering: "^([a-z])\\.\\s+(.*)"
  - label: "DASAR_HUKUM"
    prefix: "^Mengingat\\s*:\\s*"
    numbering: "^(\\d+)\\.\\s+(.*)"
  - label: "PASAL"
    prefix: "^Pasal\\s+"
    numbering: "^(\\d+)\\s*(.*)"